[project]
name = "mastercopy"
version = "0.0.0"
description = "Agentic per-title encoding on the real AWS Elemental stack."
requires-python = ">=3.12"
dependencies = []

# Only the bootstrap guardrail needs an AWS SDK. Hooks shell out to the aws
# CLI so they stay dependency-free and runnable outside the venv.
[project.optional-dependencies]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
