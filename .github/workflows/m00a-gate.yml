name: M00a gate

on:
  push:
  pull_request:

jobs:
  verdict-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Verdict schema contract tests
        run: uv run pytest -v
